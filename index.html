<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block Blast</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap');
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{color:#fff6ee;font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;height:100vh;height:100dvh;display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;overflow:hidden;background:#9a6b55;transition:background .5s}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
@keyframes bgIn{from{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
/* Coluna do jogo: tela cheia no celular, coluna centralizada no computador */
.app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;gap:clamp(6px,1.3dvh,12px);position:relative;z-index:1;align-items:stretch;min-height:0}
.app>*{flex:none}
/* Área do tabuleiro: ocupa o espaço que sobra e o tabuleiro vira o maior quadrado que cabe */
.stage{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px}
.best{grid-column:2;justify-self:center;display:flex;align-items:center;gap:8px;font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:clamp(20px,5vw,24px);color:#ffc857;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.best svg{width:32px;height:25px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.gear{grid-column:3;justify-self:end;width:44px;height:44px;border-radius:50%;border:0;background:#f3dcc4;box-shadow:0 4px 0 #7a4a35;font-size:21px;cursor:pointer;transition:transform .12s,box-shadow .12s;color:#6b3f2b}
.gear:hover{filter:brightness(1.05)}
.gear:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4a35}
.mb{height:52px;width:min(100%,300px);margin:0 auto;display:flex;align-items:center;gap:12px;padding:6px 14px 6px 8px;border-radius:18px;background:rgba(255,255,255,.14);border:2px solid var(--mc,#ffc857);box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 18px -4px var(--mc,#ffc857);transition:border-color .3s,box-shadow .3s;opacity:.55}
.mb.on{opacity:1}
.mb.hit{animation:hit .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes hit{30%{transform:scale(1.08)}}
#mx{font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:28px;min-width:72px;text-align:center;color:var(--mc,#ffc857);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.mmeta{flex:1;min-width:0}
#mt{display:block;font-weight:800;font-size:12px;line-height:1.25;white-space:normal}
.mbar{margin-top:5px;height:7px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden}
#mbi{display:block;height:100%;width:0;background:var(--mc,#ffc857);transition:width .4s,background .3s;border-radius:9px}
.center{text-align:center}
#score{font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:clamp(44px,9vh,68px);line-height:1.05;background:linear-gradient(180deg,#ff9ed8 10%,#8fb0ff 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.3));font-variant-numeric:tabular-nums;display:inline-block}
.bump{animation:bump .35s}
@keyframes bump{30%{transform:scale(1.12)}}
/* Tabuleiro: a moldura recebe a largura calculada pelo fit() */
.frame{width:min(100%,100cqh);aspect-ratio:1;flex:none;border-radius:24px;padding:9px;box-shadow:0 6px 0 rgba(0,0,0,.28),0 16px 28px rgba(0,0,0,.25)}
@keyframes frameGlow{from{box-shadow:0 6px 0 rgba(0,0,0,.28),0 16px 28px rgba(0,0,0,.25),0 0 0 0 transparent}to{box-shadow:0 6px 0 rgba(0,0,0,.28),0 16px 28px rgba(0,0,0,.25),0 0 38px -2px var(--gl,#ffc857)}}
#board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cell{border-radius:10px;box-shadow:inset 0 3px 6px rgba(0,0,0,.35)}
/* Bloco estilo bolo: cobertura com borda ondulada, base de waffle e confeitinhos */
.blk{position:relative;border-radius:7px;
  background:
    radial-gradient(circle at 50% 0%,var(--top) 60%,transparent 63%) 0 62%/34% 34% repeat-x,
    linear-gradient(var(--top),var(--top)) 0 0/100% 64% no-repeat,
    repeating-linear-gradient(45deg,rgba(90,40,10,.18) 0 2px,transparent 2px 6px) 0 100%/100% 38% no-repeat,
    repeating-linear-gradient(-45deg,rgba(90,40,10,.18) 0 2px,transparent 2px 6px) 0 100%/100% 38% no-repeat,
    linear-gradient(var(--base),var(--base)) 0 100%/100% 40% no-repeat;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 3px 0 rgba(0,0,0,.3)}
.blk::before{content:"";position:absolute;left:22%;top:20%;width:24%;height:9%;border-radius:4px;background:var(--s1);transform:rotate(-20deg)}
.blk::after{content:"";position:absolute;left:56%;top:34%;width:18%;height:9%;border-radius:4px;background:var(--s2);transform:rotate(15deg)}
/* Outros estilos de bloco */
body[data-st=solido] .blk{background:linear-gradient(170deg,var(--top) 0 45%,var(--base) 100%);border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.15),0 3px 0 rgba(0,0,0,.3)}
body[data-st=solido] .blk::before,body[data-st=solido] .blk::after{display:none}
body[data-st=gelo] .blk{background:linear-gradient(165deg,rgba(255,255,255,.8) 0%,var(--top) 30%,var(--base) 100%);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),0 4px 0 rgba(0,0,0,.25)}
body[data-st=gelo] .blk::before{left:16%;top:14%;width:34%;height:12%;border-radius:8px;background:rgba(255,255,255,.8);transform:rotate(-12deg)}
body[data-st=gelo] .blk::after{display:none}
body[data-st=listra] .blk{background:repeating-linear-gradient(135deg,var(--top) 0 8px,var(--base) 8px 16px);border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 3px 0 rgba(0,0,0,.25)}
body[data-st=listra] .blk::before,body[data-st=listra] .blk::after{display:none}
body[data-st=neon] .blk{background:var(--base);border-radius:7px;box-shadow:inset 0 0 0 2px var(--top),0 0 14px -2px var(--top)}
body[data-st=neon] .blk::before{left:18%;top:22%;width:64%;height:12%;border-radius:4px;background:var(--top);opacity:.55;transform:none}
body[data-st=neon] .blk::after{display:none}
.cell.hint{background:rgba(255,240,220,.2);box-shadow:inset 0 0 0 2px rgba(255,240,220,.65)}
.cell.pop{animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);filter:brightness(1.4)}100%{transform:scale(1)}}
.cell.clr{animation:clear .46s ease-in forwards}
@keyframes clear{0%{filter:brightness(1)}35%{filter:brightness(1.8) saturate(.4);transform:scale(1.12)}100%{transform:scale(0) rotate(30deg);opacity:0}}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
/* Bandeja de peças */
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-items:center;gap:8px;height:clamp(92px,15dvh,132px);align-items:center;width:100%}
.slot{width:100%;height:100%;display:flex;align-items:center;justify-content:center;cursor:grab;transition:transform .2s;touch-action:none}
@media (hover:hover){.slot:not(.empty):hover{transform:translateY(-4px)}}
/* a peça escolhida sai da bandeja e vai junto com o dedo/mouse */
.slot.lifted{opacity:0;transition:none}
.slot.empty{opacity:0;pointer-events:none}
.slot.in{animation:slotIn .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes slotIn{from{opacity:0;transform:translateY(24px) scale(.85)}}
.pc{display:grid}
.pc .e{background:none;box-shadow:none}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:scale(1.06);will-change:left,top;filter:drop-shadow(0 16px 14px rgba(0,0,0,.4))}
.lvl{grid-column:1;justify-self:start;min-width:0;display:inline-flex;align-items:center;gap:8px;background:#f3dcc4;color:#6b3f2b;border-radius:14px;padding:4px 10px 4px 4px;font-weight:800;font-size:12px;line-height:1.1;box-shadow:0 3px 0 #7a4a35}
.lvl b{flex:none;min-width:30px;height:30px;display:grid;place-items:center;background:#6b3f2b;color:#fff;border-radius:10px;font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:16px}
.lvlt{min-width:0;display:flex;flex-direction:column;gap:4px}
.lvlt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{width:100%;min-width:56px;height:6px;border-radius:9px;background:#d9b99c;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ed8,#8fb0ff);transition:width .4s}
.fl{position:fixed;transform:translateX(-50%);font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:21px;color:#fff6ee;text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none;z-index:60;white-space:nowrap;animation:fl 1.3s ease-out forwards}
.fl.line{color:#b8f5cf}.fl.combo{color:#ffc857;font-size:25px}.fl.big{color:#bcd6ff}.fl.clutch{color:#ffb8e0}.fl.perfect{color:#ffe08a;font-size:28px}
@keyframes fl{0%{opacity:0;margin-top:14px;scale:.6}15%{opacity:1;scale:1.15}25%{scale:1}80%{opacity:1}100%{opacity:0;margin-top:-30px}}
#banner{position:fixed;left:50%;top:14%;transform:translateX(-50%);opacity:0;pointer-events:none;z-index:65;text-align:center;white-space:nowrap}
#banner small{display:block;font-size:13px;letter-spacing:.5px;color:#ffe9d6;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#banner b{display:block;font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:34px;color:#ffc857;text-shadow:0 4px 0 rgba(0,0,0,.4)}
#banner.show{animation:banner 2s ease forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-18px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1.06)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-24px)}}
.over{position:fixed;inset:0;background:rgba(20,10,30,.55);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:70}
.over.show{display:flex}
.card{background:#f6e2cc;color:#6b3f2b;padding:24px;border-radius:28px;text-align:center;width:min(88vw,330px);display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 8px 0 #b08068,0 24px 40px rgba(0,0,0,.5);animation:cardIn .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardIn{from{opacity:0;transform:scale(.85) translateY(16px)}}
.card h2{font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:30px}
.stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:#fff4e6;border-radius:14px;padding:9px;display:flex;flex-direction:column}
.stats span{font-size:12px;font-weight:700;opacity:.75}
.stats b{font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-size:20px}
.btn{width:100%;font-family:"Fredoka",ui-rounded,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:18px;border:0;border-radius:16px;padding:12px;background:#ffc857;color:#5a3418;cursor:pointer;box-shadow:0 4px 0 #b07a1f;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b07a1f}
.btn.alt{background:#f1cfe0;box-shadow:0 4px 0 #b5788f}
.btn.alt:active{box-shadow:0 1px 0 #b5788f}
/* Ícones desenhados, moedas e loja */
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
[data-ic]{display:inline-flex}
.hr{grid-column:3;justify-self:end;display:flex;align-items:center;gap:8px}
.gear{display:grid;place-items:center;font-size:24px;padding:0}
.coins{height:40px;display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;border:0;border-radius:99px;background:#f3dcc4;color:#6b3f2b;box-shadow:0 4px 0 #7a4a35;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:700;font-size:16px;cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s}
.coins:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4a35}
.coins [data-ic]{font-size:24px}
.shop{max-height:92dvh;overflow:auto}
.shopbal{display:flex;align-items:center;gap:6px;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-size:24px;font-weight:700}
.shopbal [data-ic]{font-size:30px}
#shopList{width:100%;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:10px;background:#fff4e6;border-radius:16px;padding:8px 10px;text-align:left}
.sic{display:flex;gap:2px;font-size:28px;color:#6b3f2b;min-width:34px}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.sinfo b{font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-size:16px}
.sinfo small{font-size:12px;font-weight:700;opacity:.75;line-height:1.2}
.buy{border:0;border-radius:12px;padding:8px 10px;background:#ffc857;color:#5a3418;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:15px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 #b07a1f;cursor:pointer}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #b07a1f}
.buy:disabled{opacity:.45;cursor:default}
.buy .ic{font-size:18px}
@media (max-width:400px){.gear{width:38px;height:38px}.coins{padding:0 9px 0 6px;font-size:15px}.hr{gap:6px}}
/* Novos estilos de bloco, animações e formas */
body[data-st=pixel] .blk{background:var(--base);border-radius:2px;box-shadow:inset 3px 3px 0 var(--top),inset -3px -3px 0 rgba(0,0,0,.28),0 3px 0 rgba(0,0,0,.35)}
body[data-st=pixel] .blk::before{left:26%;top:26%;width:20%;height:20%;border-radius:0;background:rgba(255,255,255,.6);transform:none}
body[data-st=pixel] .blk::after{display:none}
body[data-st=metal] .blk{background:linear-gradient(135deg,var(--top) 0,var(--base) 42%,var(--top) 58%,var(--base) 100%);border-radius:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.3)}
body[data-st=metal] .blk::before,body[data-st=metal] .blk::after{width:14%;height:14%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#888);transform:none}
body[data-st=metal] .blk::before{left:10%;top:10%}
body[data-st=metal] .blk::after{left:76%;top:76%}
body[data-st=lego] .blk{background:var(--base);border-radius:5px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 rgba(0,0,0,.3)}
body[data-st=lego] .blk::before{left:27%;top:22%;width:46%;height:46%;border-radius:50%;background:var(--top);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.18);transform:none}
body[data-st=lego] .blk::after{display:none}
@keyframes tw{0%,100%{transform:rotate(-20deg) scale(1)}50%{transform:rotate(-20deg) scale(1.5)}}
@keyframes tw2{0%,100%{transform:rotate(15deg) scale(1)}50%{transform:rotate(15deg) scale(1.5)}}
body[data-st=bolo] .blk::before{animation:tw 2.8s ease-in-out infinite}
body[data-st=bolo] .blk::after{animation:tw2 3.3s ease-in-out infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
body[data-st=gelo] .blk,body[data-st=solido] .blk{overflow:hidden}
body[data-st=gelo] .blk::after,body[data-st=solido] .blk::after{display:block;left:-60%;top:0;width:36%;height:100%;border-radius:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-15deg);animation:shine 3.6s ease-in-out infinite}
@keyframes nb{from{opacity:.3}to{opacity:.95}}
body[data-st=neon] .blk::before,body[data-st=pixel] .blk::before{animation:nb 1.8s ease-in-out infinite alternate}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:.95;transform:scale(1)}}
body[data-st=listra] .blk::after{display:block;left:62%;top:14%;width:24%;height:24%;border-radius:0;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);transform:none;animation:spark 2.4s ease-in-out infinite}
.blk:nth-child(3n)::before,.blk:nth-child(3n)::after{animation-delay:-1.1s}
.blk:nth-child(5n)::before,.blk:nth-child(5n)::after{animation-delay:-2.2s}
.blk:nth-child(7n)::before,.blk:nth-child(7n)::after{animation-delay:-.5s}
body[data-sh=c] .blk,body[data-sh=c] .cell{border-radius:50%}
body[data-sh=s] .blk,body[data-sh=s] .cell{border-radius:3px}
/* Seletor de temas */
.themes{width:min(94vw,440px)}
.tgrid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;overflow:auto;max-height:54dvh;padding:4px}
.tile{border:0;border-radius:14px;padding:8px 5px 7px;font-family:"Nunito",system-ui,sans-serif;font-weight:800;font-size:11px;line-height:1.15;text-align:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);color:#fff6ee}
.tile.sel{outline:3px solid #ffc857;outline-offset:2px}
.tile .sw{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;width:38px;margin:0 auto 6px;padding:3px;border-radius:7px;box-shadow:inset 0 2px 3px rgba(0,0,0,.35);font-size:20px;color:#fff;place-items:center}
.tile .sw i{width:100%;aspect-ratio:1;border-radius:4px;background:linear-gradient(var(--a),var(--b))}
.tile .sw.rnd{grid-template-columns:1fr;background:rgba(255,255,255,.25)}
.tile span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Conquistas */
.center{position:relative}
.lvl{cursor:pointer;transition:transform .12s}.lvl:active{transform:translateY(2px)}
#lvList{width:100%;display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:52dvh;padding-right:2px}
.arow.cur{outline:3px solid #ffc857;outline-offset:-1px;background:#fff0c9}
.arow .ln{flex:none;min-width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#6b3f2b;color:#fff;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:17px}
.arow.done .ln{background:#2fa36b}
.arow .lp{margin-left:auto;flex:none;font-style:normal;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:14px;text-align:right;line-height:1.15}
.arow .lp small{display:block;font-size:11px;opacity:.7}
.arow.lock .ln{filter:none}
.trophy{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:50%;background:#f3dcc4;color:#6b3f2b;box-shadow:0 4px 0 #7a4a35;display:grid;place-items:center;font-size:26px;cursor:pointer;transition:box-shadow .12s}
.trophy:active{transform:translateY(calc(-50% + 3px));box-shadow:0 1px 0 #7a4a35}
.trophy.new::after{content:"";position:absolute;top:1px;right:1px;width:13px;height:13px;border-radius:50%;background:#ff5d8f;border:2px solid #fff}
.achp{font-weight:800;font-size:14px;opacity:.8;margin-top:-6px}
#achList{width:100%;display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:52dvh;padding-right:2px}
.arow{display:flex;align-items:center;gap:10px;background:#fff4e6;border-radius:14px;padding:7px 10px;text-align:left}
.arow .ic{font-size:28px}
.arow.lock{opacity:.5}.arow.lock .ic{filter:grayscale(1)}
.arow b{display:block;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-size:15px}
.arow small{display:block;font-size:12px;font-weight:700;opacity:.8;line-height:1.2}
/* Itens especiais */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tool{position:relative;height:50px;border:0;border-radius:16px;background:#f3dcc4;color:#6b3f2b;box-shadow:0 4px 0 #7a4a35;font-family:"Fredoka",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .2s}

  body{padding:24px 16px}
}

@media (orientation:landscape) and (max-height:640px){
  body{padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

function randPiece(){
  const bigChance=level>=3?Math.min(0.2+level*0.08,0.7):0;
  const pool=Math.random()<bigChance?BIG:SMALL;
  const shape=pool[Math.floor(Math.random()*pool.length)];
  let gem=null,sp=null;
  const cl=[];shape.forEach((row,i)=>row.forEach((v,j)=>{if(v)cl.push([i,j]);}));
  if(level>=2&&Math.random()<.2)gem=cl[Math.floor(Math.random()*cl.length)];
  else if(level>=2&&Math.random()<.14){const c=cl[Math.floor(Math.random()*cl.length)];sp=[c[0],c[1],Math.random()<.5?'bolt':'boom'];}
  return{shape,color:TH[Math.floor(Math.random()*TH.length)],gem,sp};
}
function fits(shape,r,c){
  for(let i=0;i<shape.length;i++)for(let j=0;j<shape[i].length;j++){
    if(!shape[i][j])continue;const R=r+i,C=c+j;
    if(R<0||C<0||R>=N||C>=N||grid[R][C]!==null)return false;
  }
  return true;
}
const canPlaceAny=shape=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(shape,r,c))return true;return false;};

let master=null;
function ensureMaster(){
  if(!master){
    master=actx.createGain();master.gain.value=0.95;
    const comp=actx.createDynamicsCompressor();
    comp.threshold.value=-14;comp.ratio.value=4;
    master.connect(comp);comp.connect(actx.destination);
  }
}
// Notas musicais: onda principal + harmônico suave, com ataque rápido e decaimento natural
function sfx(notes,d=.22,gap=0,type='sine'){
  if(muted)return;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    ensureMaster();
    notes.forEach((f,i)=>{
      const t=actx.currentTime+i*gap+.005;
      [[f,type,.42],[f*2,'triangle',.14]].forEach(([fr,ty,v])=>{
        const o=actx.createOscillator(),g=actx.createGain();
        o.type=ty;o.frequency.setValueAtTime(fr,t);
        g.gain.setValueAtTime(.0001,t);
        g.gain.linearRampToValueAtTime(v,t+.012);
        g.gain.exponentialRampToValueAtTime(.0005,t+d);
        o.connect(g).connect(master);o.start(t);o.stop(t+d+.05);
      });
    });
  }catch(e){}
}
// Efeito de "pop" com variação de altura (encaixe, pegar peça, erro)
function pop(f0,f1,d=.1,type='sine',v=.4){
  if(muted)return;
  try{
    actx=actx||new(window.AudioContext||window.webkitAudioContext)();
    ensureMaster();
    const t=actx.currentTime;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);
    o.connect(g).connect(master);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}

function place(i,r,c){
  const p=tray[i],before=filled(),cells=p.shape.flat().reduce((a,b)=>a+b,0);
  const fresh=[];
  p.shape.forEach((row,a)=>row.forEach((v,b)=>{if(v){grid[r+a][c+b]=p.color;gemG[r+a][c+b]=!!(p.gem&&p.gem[0]===a&&p.gem[1]===b);fresh.push((r+a)*8+c+b);}}));
  tray[i]=null;
  renderTray();
  stats.pieces++;

  const rows=[],cols=[];
  for(let a=0;a<N;a++)if(grid[a].every(v=>v!==null))rows.push(a);
  for(let b=0;b<N;b++)if(grid.every(row=>row[b]!==null))cols.push(b);
  const sx=new Set();
  if(p.sp){
    const sr=r+p.sp[0],sc=c+p.sp[1];
    if(p.sp[2]==='bolt'){for(let k=0;k<N;k++){sx.add(sr*8+k);sx.add(k*8+sc);}}
    else for(let a=sr-1;a<=sr+1;a++)for(let b=sc-1;b<=sc+1;b++)if(a>=0&&b>=0&&a<N&&b<N)sx.add(a*8+b);
  }
  const lines=rows.length+cols.length+(p.sp?1:0);
  lastLines=lines;
  const clr=new Set();
  rows.forEach(a=>{for(let b=0;b<N;b++)clr.add(a*8+b);});
  cols.forEach(b=>{for(let a=0;a<N;a++)clr.add(a*8+b);});
  sx.forEach(k=>{if(grid[k>>3][k&7]!==null)clr.add(k);});

  if(lines){combo+=Math.min(3,lines);miss=0;}
  else if(combo>0){miss++;if(miss>=GRACE){combo=0;miss=0;lastTier=0;}}
  const mult=multOf(),ti=tierIdx();

  const lineGain=25*lines*lines;
  const cross=rows.length&&cols.length?rows.length*cols.length*30:0;
  const big=cells>=5?cells*2:0;
  const clutch=lines&&before+cells>=48?Math.round(lineGain*.3):0;
  const perfect=lines&&before+cells-clr.size===0?400*level:0;
  const lm=1+(level-1)*.05;
  const base=(cells+lineGain+big+clutch+cross)*lm;
  let gems=0;clr.forEach(k=>{if(gemG[k>>3][k&7])gems++;});
  let stn=0;clr.forEach(k=>{if(grid[k>>3][k&7]==='x')stn++;});
  const total=Math.round((base+perfect+gems*60+stn*40)*mult);

  const parts=[['+'+cells,'base']];
  if(lines)parts.push([(lines>1?lines+' linhas':'Linha')+' +'+Math.round(lineGain*mult),'line']);
  if(cross)parts.push(['Cruzamento +'+Math.round(cross*mult),'perfect']);
  if(big)parts.push(['Peça grande +'+Math.round(big*mult),'big']);
  if(clutch)parts.push(['Sob pressão +'+Math.round(clutch*mult),'clutch']);
  if(perfect)parts.push(['Limpeza perfeita +'+Math.round(perfect*mult),'perfect']);
  if(gems)parts.push(['Gema'+(gems>1?'s':'')+' +'+Math.round(gems*60*mult),'perfect']);
  if(p.sp)parts.push([p.sp[2]==='bolt'?'Raio!':'Explosão!','perfect']);
  if(stn)parts.push(['Pedra quebrada +'+Math.round(stn*40*mult),'big']);
  const cg=(lines?5+Math.floor(Math.random()*11):0)+gems*10+(perfect?50:0)+stn*15;
  if(cg)parts.push(['+'+cg+' moedas','combo']);
  if(mult>1)parts.push(['Multiplicador x'+mult,'combo']);

  stats.lines+=lines;stats.best=Math.max(stats.best,combo);
  addScore(total);
  if(cg)addCoins(cg);
  parts.forEach((pt,k)=>popup(pt[0],pt[1],k));
  paint(fresh);
  busy=true;
  hud();
  if(lines){
    const mb=$('mb');mb.classList.remove('hit');void mb.offsetWidth;mb.classList.add('hit');
    if(ti>lastTier&&ti>=2)setTimeout(()=>banner(`<small>Multiplicador</small><b>x${mult} ${TIERS[ti][1]}</b>`),500);
    lastTier=ti;
    sfx(lines>=2?[523,659,784,988,1318]:[523,659,784,1046],.26,.07);
    bgE=Math.min(4,bgE+lines*.9);
    const board=$('bw');board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake');
    clr.forEach(k=>{
      const el=cellEls[k];el.classList.add('clr');
      if(Math.random()<.55){
        const q=el.getBoundingClientRect();
        burst(q.left+q.width/2,q.top+q.height/2,grid[k>>3][k&7],7);
      }
    });
    if(lines>=3)setTimeout(()=>banner(`<small>Limpeza múltipla</small><b>${lines} de uma vez</b>`),350);
    if(combo>=3)unlock('combo3');
    unlock('first');
    setTimeout(()=>{
      clr.forEach(k=>{grid[k>>3][k&7]=null;gemG[k>>3][k&7]=false;});
      paint();finishTurn();
      if(filled()===0)themeSwitch();
    },460);
  }else{
    pop(620,300,.11,'sine',.4);
    setTimeout(finishTurn,220);
  }
  if(p.sp){unlock('spec1');pop(900,180,.3,'sawtooth',.25);}
  if(stn)unlock('stone1');
  if(perfect)unlock('perfect');
  if(cells>=5)unlock('big');
  life.lines+=lines;life.gems+=gems;store.set('bb-life',life);
  if(lines>=2)unlock('multi2');
  if(lines>=4)unlock('multi4');
  if(combo>=6)unlock('combo6');
  if(clutch)unlock('clutch');
  if(gems)unlock('gem1');
  if(life.gems>=10)unlock('gem10');
  if(life.lines>=50)unlock('lines50');
  if(stats.pieces>=100)unlock('pieces100');
}

function dropStone(){
  const e=[];for(let k=0;k<64;k++)if(grid[k>>3][k&7]===null)e.push(k);
  if(e.length<14)return;
  const k=e[Math.floor(Math.random()*e.length)];
  grid[k>>3][k&7]='x';gemG[k>>3][k&7]=false;paint([k]);
  const q=cellEls[k].getBoundingClientRect();burst(q.left+q.width/2,q.top+q.height/2,'x',10);
  pop(150,70,.2,'triangle',.4);
  const bd=$('bw');bd.classList.remove('shake');void bd.offsetWidth;bd.classList.add('shake');
  popup('Pedra! Quebre com uma linha','clutch',0);
}
function finishTurn(){
  busy=false;
  if(!dead&&!lastLines&&level>=2&&stats.pieces>0&&stats.pieces%6===0)dropStone();
  let fresh=[];
  if(tray.every(p=>!p)){tray=[randPiece(),randPiece(),randPiece()];fresh=[0,1,2];}
  renderTray(fresh);
  hud();
  checkStuck();
}

function gameOver(){
  dead=true;
  sfx([392,330,262,196],.5,.2,'triangle');
  $('endStats').innerHTML=[
    ['Pontuação',score],['Nível',level],['Linhas limpas',stats.lines],
    ['Peças usadas',stats.pieces],['Melhor sequência',stats.best],['Conquistas',`${ach.length}/${Object.keys(ACH).length}`]
  ].map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
  $('endOver').classList.add('show');
  hud();
}

// O CSS dimensiona o tabuleiro; aqui só calculamos o tamanho da célula e redesenhamos a bandeja
let lastFit='';
function fit(force){
  const f=$('bw'),w=f.clientWidth;
  if(!w)return;
  document.documentElement.style.setProperty('--u',(w-18-35)/8);
  const key=w+'x'+trayEl.clientWidth+'x'+trayEl.clientHeight;
  if(drag||(!force&&key===lastFit))return;
  lastFit=key;
  if(tray)renderTray();
}
if(window.ResizeObserver){const ro=new ResizeObserver(()=>fit());ro.observe($('bw'));ro.observe(trayEl);}
addEventListener('resize',()=>fit());
addEventListener('orientationchange',()=>setTimeout(()=>fit(),250));
if(document.fonts)document.fonts.ready.then(()=>fit(true));

// ---------- troca automática de tema ao zerar o tabuleiro ----------
let swapping=false;
function themeSwitch(){
  if(swapping||dead)return;
  swapping=true;busy=true;updTools();
  const cand=THK.filter(k=>k!==curTh),id=cand[Math.floor(Math.random()*cand.length)],t=THEMES[id];
  const bw=$('bw'),r=bw.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const maxR=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))+20;
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const done=()=>{
    bw.classList.remove('land');void bw.offsetWidth;bw.classList.add('land');
    setTimeout(()=>bw.classList.remove('land'),750);
    const cols=t.p.flatMap(c=>[c[0],c[1]]);
    for(let i=0;i<90;i++){const a=Math.random()*6.283,s=3+Math.random()*9;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:1,c:cols[i%cols.length]});}
    sfx([523,659,784,1046,1318,1568],.3,.07);
    banner(`<small>Tabuleiro zerado! Novo tema</small><b>${t.n}</b>`);
    swapping=false;busy=false;updTools();
  };
  if(still){setTheme(id);done();return;}
  sfx([392,523,659],.2,.06);
  bw.classList.remove('tada');void bw.offsetWidth;bw.classList.add('tada');
  setTimeout(()=>{
    bw.classList.remove('tada');
    if(document.startViewTransition){
      let tr;
      try{tr=document.startViewTransition(()=>{setTheme(id);});}catch(e){setTheme(id);done();return;}
      tr.ready.then(()=>{
        document.documentElement.animate(
          {clipPath:[`circle(0px at ${cx}px ${cy}px)`,`circle(${maxR}px at ${cx}px ${cy}px)`]},
          {duration:1000,easing:'cubic-bezier(.55,0,.25,1)',pseudoElement:'::view-transition-new(root)'});
      }).catch(()=>{});
      tr.finished.catch(()=>{}).finally(done);
    }else{
      // alternativa para navegadores sem View Transitions: clarão e troca
      const f=document.createElement('div');f.className='twflash';document.body.appendChild(f);
      f.animate([{opacity:0},{opacity:1}],{duration:260,fill:'forwards'}).finished.then(()=>{
        setTheme(id);
        return f.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'}).finished;
      }).catch(()=>{setTheme(id);}).finally(()=>{f.remove();done();});
    }
  },520);
}

// ---------- controles ----------
let pref=store.get('bb-theme','random');
function syncTheme(){$('themeBtn').textContent='Tema: '+THEMES[curTh].n;}
function markThemes(){$('tGrid').querySelectorAll('.tile').forEach(t=>t.classList.toggle('sel',t.dataset.id===(THEMES[pref]?pref:'random')));}
function openThemes(){
  if(dead||busy||drag)return;
  disarm();paused=true;$('menuOver').classList.remove('show');
  const g=$('tGrid');
  if(!g.dataset.ok){
    g.dataset.ok=1;
    g.innerHTML='<button class="tile" data-id="random" style="background:linear-gradient(160deg,#8a6bd6,#e0708a)"><div class="sw rnd">'+ICON.swap+'</div><span>Aleatório</span></button>'+THK.map(id=>{
      const t=THEMES[id];
      return `<button class="tile" data-id="${id}" style="background:linear-gradient(160deg,${t.bg[0]},${t.bg[1]});color:${t.ink||'#fff6ee'}"><div class="sw" style="background:${t.fr}">${t.p.map(c=>`<i style="--a:${c[0]};--b:${c[1]}"></i>`).join('')}</div><span>${t.n}</span></button>`;
    }).join('');
    g.onclick=e=>{
      const b=e.target.closest('.tile');if(!b)return;
      pref=b.dataset.id;store.set('bb-theme',pref);
      setTheme(pref==='random'?THK[Math.floor(Math.random()*THK.length)]:pref);
      markThemes();pop(520,780,.1,'sine',.3);
    };
  }
  $('tCount').textContent=THK.length+' temas · toque para escolher';
  markThemes();$('themeOver').classList.add('show');updTools();
  const sel=g.querySelector('.sel');if(sel)sel.scrollIntoView({block:'center'});
}
function closeThemes(){paused=false;$('themeOver').classList.remove('show');updTools();}
function setTheme(id){curTh=id;const t=THEMES[id];document.body.dataset.th=id;document.body.dataset.st=t.st;document.body.dataset.sh=t.sh||'r';setFx(t);syncTheme();}
function newGame(){
  {const o=THK.filter(k=>k!==curTh);setTheme(o[Math.floor(Math.random()*o.length)]);}
  grid=Array.from({length:N},()=>Array(N).fill(null));
  gemG=Array.from({length:N},()=>Array(N).fill(false));
  inv={bomb:1,swap:1,rot:2};armed=false;coins=0;$('coinN').textContent=0;$('shopN').textContent=0;document.body.classList.remove('aim');
  score=0;shown=0;combo=0;miss=0;lastTier=0;level=1;
  stats={lines:0,pieces:0,best:0};
  dead=false;paused=false;busy=false;drag=null;swapping=false;lastLines=0;
  tray=[randPiece(),randPiece(),randPiece()];
  paint();renderTray([0,1,2]);hud();
  $('score').textContent=0;
  $('endOver').classList.remove('show');
  $('menuOver').classList.remove('show');
  fit(true);
}
function openMenu(){if(!dead&&!busy){disarm();paused=true;updTools();$('menuOver').classList.add('show');}}
function closeMenu(){paused=false;updTools();$('menuOver').classList.remove('show');}
function syncSound(){$('sound').textContent='Som: '+(muted?'desligado':'ligado');}
$('gear').onclick=openMenu;
$('resume').onclick=closeMenu;
$('newFromMenu').onclick=newGame;
$('again').onclick=newGame;
$('sound').onclick=()=>{muted=!muted;store.set('bb-mute',muted);syncSound();};
$('themeBtn').onclick=openThemes;$('themeClose').onclick=closeThemes;
$('lvlBox').onclick=openLvl;$('lvlBox').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openLvl();};$('lvlClose').onclick=closeLvl;
$('trophyBtn').onclick=openAch;$('achFromMenu').onclick=openAch;$('achClose').onclick=closeAch;
$('coinBtn').onclick=openShop;$('shopFromMenu').onclick=openShop;$('shopClose').onclick=closeShop;
$('coinN').textContent=coins;icons();
syncSound();
newGame();
</script>
